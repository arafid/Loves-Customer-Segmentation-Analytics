<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Historical campaign goals achieved</title>
  <desc id="desc">Gallons Extra achieved 9,488 goals, DEF Extra 6,044, and Merch Extra 4,712.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#24292f">Historical Campaign Goal Achievement</text>
  <text x="360" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#57606a">Goals achieved by campaign type</text>
  <g font-family="Arial, sans-serif">
    <text x="165" y="123" text-anchor="end" font-size="14" fill="#24292f">Gallons Extra</text>
    <rect x="184" y="96" width="455" height="38" rx="5" fill="#0969da"/>
    <text x="649" y="121" font-size="14" font-weight="700" fill="#24292f">9,488</text>
    <text x="165" y="203" text-anchor="end" font-size="14" fill="#24292f">DEF Extra</text>
    <rect x="184" y="176" width="290" height="38" rx="5" fill="#54aeff"/>
    <text x="484" y="201" font-size="14" font-weight="700" fill="#24292f">6,044</text>
    <text x="165" y="283" text-anchor="end" font-size="14" fill="#24292f">Merch Extra</text>
    <rect x="184" y="256" width="226" height="38" rx="5" fill="#8c959f"/>
    <text x="420" y="281" font-size="14" font-weight="700" fill="#24292f">4,712</text>
  </g>
  <line x1="184" y1="316" x2="639" y2="316" stroke="#d0d7de"/>
  <g font-family="Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle">
    <text x="184" y="335">0</text><text x="275" y="335">2,000</text><text x="366" y="335">4,000</text><text x="457" y="335">6,000</text><text x="548" y="335">8,000</text><text x="639" y="335">10,000</text>
  </g>
</svg>
